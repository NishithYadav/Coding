<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="displayName()">Display</button>

    
    <p id="output"></p>

    <script>
        function F(FN) {  
            return FN;
        }
        function L(LN) {
            return LN;
        }
        function displayName() {
            let firstname = F("Nishith");
            let lastname = L("Yadav");
            
        
            document.getElementById("output").innerText = "My name is " + firstname + " " + lastname;
        }
    </script>

</body>
</html>
